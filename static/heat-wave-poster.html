<!DOCTYPE html>
<html lang="mk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Преживеј ја жештината — climate.mk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#231A15;
    --ink-soft:#5A4E44;
    --paper:#F1ECE3;
    --paper-2:#F8F4EC;
    --card:#FCFAF5;
    --line:#DBD1C1;

    --cool:#2F7D67;
    --ready:#C88A16;
    --alive:#C0271C;
    --deep:#7C130E;

    --shadow:0 1px 0 rgba(35,26,21,.04), 0 10px 30px -18px rgba(35,26,21,.35);
    --maxw:1120px;
  }

  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;background:var(--paper);color:var(--ink);
    font-family:"IBM Plex Sans",system-ui,sans-serif;line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:var(--maxw);margin:0 auto;padding:0 clamp(18px,4vw,40px);}

  /* ---------- top bar ---------- */
  .topbar{border-bottom:1px solid var(--line);background:var(--paper-2);position:sticky;top:0;z-index:20;}
  .topbar .wrap{display:flex;align-items:center;justify-content:space-between;gap:10px 14px;min-height:54px;padding-top:8px;padding-bottom:8px;flex-wrap:wrap;}
  .brand{font-family:"IBM Plex Mono",monospace;font-weight:600;letter-spacing:.02em;font-size:15px;}
  .brand b{color:var(--alive);}
  .tbright{display:flex;align-items:center;gap:16px;}
  .topbar .tag{font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-soft);}
  .langsel{display:inline-flex;border:1.5px solid var(--line);border-radius:8px;overflow:hidden;flex:none;}
  .langbtn{font-family:"IBM Plex Mono",monospace;font-size:12px;font-weight:600;letter-spacing:.06em;padding:7px 13px;background:transparent;color:var(--ink-soft);border:0;border-left:1px solid var(--line);cursor:pointer;transition:background .15s ease,color .15s ease;}
  .langbtn:first-child{border-left:0;}
  .langbtn:hover{color:var(--ink);}
  .langbtn[aria-pressed="true"]{background:var(--alive);color:#fff;}
  .langbtn:focus-visible{outline:3px solid var(--alive);outline-offset:-3px;}

  /* ---------- layout with heat spine ---------- */
  .stage{display:grid;grid-template-columns:64px 1fr;max-width:var(--maxw);margin:0 auto;}
  .spine{position:relative;background:linear-gradient(to bottom,
      #2F7D67 0%,#2F7D67 20%,#E7C21C 32%,#E7C21C 48%,
      #E07B24 58%,#E07B24 72%,#C0271C 84%,var(--deep) 100%);}
  .spine .lab{position:absolute;left:0;right:0;font-family:"IBM Plex Mono",monospace;font-size:9px;letter-spacing:.14em;color:#fff;text-align:center;transform:rotate(180deg);writing-mode:vertical-rl;opacity:.95;}
  .spine .lab.l1{top:5%;} .spine .lab.l2{top:34%;} .spine .lab.l3{top:58%;} .spine .lab.l4{top:82%;}
  .spine .tick{position:absolute;left:50%;width:1px;height:20px;background:rgba(255,255,255,.5);transform:translateX(-50%);}
  .spine .tick.t1{top:29%;} .spine .tick.t2{top:55%;} .spine .tick.t3{top:80%;}

  .column{min-width:0;}

  /* ---------- hero ---------- */
  .hero{padding:clamp(40px,7vw,84px) clamp(18px,4vw,48px) clamp(34px,5vw,56px);}
  .eyebrow{font-family:"IBM Plex Mono",monospace;font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:var(--alive);margin:0 0 18px;}
  .hero h1{font-family:"Oswald",sans-serif;font-weight:700;text-transform:uppercase;letter-spacing:.005em;font-size:clamp(46px,10vw,120px);line-height:.92;margin:0;
    background:linear-gradient(96deg,#3a2a12 0%,var(--alive) 46%,var(--deep) 78%,#3a2a12 100%);background-size:220% 100%;
    -webkit-background-clip:text;background-clip:text;color:transparent;animation:shimmer 7s ease-in-out infinite;}
  @keyframes shimmer{0%,100%{background-position:0% 0}50%{background-position:100% 0}}
  .hero .sub{font-size:clamp(17px,2.4vw,22px);max-width:46ch;color:var(--ink);margin:22px 0 0;font-weight:500;}
  .hero .lede{max-width:60ch;color:var(--ink-soft);margin:12px 0 0;font-size:16px;}
  .call{display:inline-flex;align-items:stretch;margin-top:30px;border:2px solid var(--deep);border-radius:12px;overflow:hidden;background:var(--card);box-shadow:var(--shadow);text-decoration:none;color:var(--ink);}
  .call .l{background:var(--deep);color:#fff;padding:14px 18px;font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.12em;text-transform:uppercase;display:flex;align-items:center;line-height:1.3;white-space:normal;max-width:12ch;}
  .call .n{padding:10px 26px;display:flex;flex-direction:column;justify-content:center;}
  .call .n b{font-family:"Oswald",sans-serif;font-size:44px;font-weight:700;line-height:1;color:var(--deep);}
  .call .n span{font-size:12px;color:var(--ink-soft);letter-spacing:.04em;}

  /* ---------- official guidance ---------- */
  .official{padding:clamp(30px,4vw,44px) clamp(18px,4vw,48px);border-top:1px solid var(--line);background:var(--paper-2);}
  .official .stamp{display:inline-block;font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:#fff;background:var(--ink);padding:5px 10px;border-radius:5px;}
  .official h2{font-family:"Oswald",sans-serif;font-weight:600;text-transform:uppercase;letter-spacing:.03em;font-size:clamp(22px,3.2vw,32px);margin:14px 0 4px;line-height:1.02;}
  .official .src{font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--ink-soft);margin:0 0 22px;letter-spacing:.01em;}
  .cols{display:grid;grid-template-columns:1fr 1fr;gap:clamp(20px,3vw,40px);}
  .panel-title{font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft);margin:0 0 12px;}
  .scale{margin:0 0 16px;}
  .scale .row{display:flex;align-items:center;gap:11px;padding:8px 0;border-bottom:1px solid var(--line);}
  .scale .sw{width:16px;height:16px;border-radius:4px;flex:none;}
  .scale .nm{font-family:"Oswald",sans-serif;font-weight:600;text-transform:uppercase;font-size:14px;flex:0 0 auto;min-width:78px;}
  .scale .ds{font-size:13.5px;color:#4a4038;}
  .season{font-size:14.5px;color:#38302a;margin:0;} .season b{color:var(--ink);}
  .check{list-style:none;margin:0;padding:0;display:grid;gap:12px;}
  .check li{position:relative;padding-left:30px;font-size:15px;color:#38302a;}
  .check li::before{content:"";position:absolute;left:0;top:2px;width:17px;height:17px;border-radius:5px;border:2px solid var(--cool);background:linear-gradient(135deg,transparent 46%,var(--cool) 46%,var(--cool) 54%,transparent 54%);}
  .check li b{color:var(--ink);}
  .official a{color:var(--alive);text-decoration:underline;text-underline-offset:2px;text-decoration-thickness:1px;transition:color .15s ease;}
  .official a:hover{color:var(--deep);}
  .sources{margin:26px 0 0;padding-top:16px;border-top:1px solid var(--line);}
  .sources .panel-title{margin-bottom:10px;}
  .sources ul{list-style:none;margin:0;padding:0;display:grid;gap:9px;}
  .sources li{font-size:13.5px;color:var(--ink-soft);padding-left:16px;position:relative;}
  .sources li::before{content:"\2192";position:absolute;left:0;color:var(--alive);}
  .sources li b{color:var(--ink);font-family:inherit;font-size:inherit;letter-spacing:0;text-transform:none;display:inline;}
  .live{margin:26px 0 0;border:1px solid var(--line);border-radius:12px;background:var(--card);padding:18px 20px;box-shadow:var(--shadow);display:grid;grid-template-columns:1fr auto;gap:16px 24px;align-items:center;}
  .live .txt{min-width:0;}
  .live .now{display:flex;align-items:center;gap:8px;margin:0 0 4px;}
  .live .dot{width:9px;height:9px;border-radius:50%;background:var(--alive);flex:none;animation:pulse 2s ease-in-out infinite;}
  @keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.8)}}
  .live .now span{font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--alive);}
  .live h3{font-family:"Oswald",sans-serif;font-weight:600;text-transform:uppercase;letter-spacing:.02em;font-size:19px;margin:0 0 5px;line-height:1.05;}
  .live p{margin:0;font-size:13.5px;color:var(--ink-soft);}
  .live .btns{display:flex;flex-wrap:wrap;gap:10px;justify-content:flex-end;}
  .live .btn{display:inline-flex;flex-direction:column;text-decoration:none;border:1.5px solid var(--ink);border-radius:9px;padding:9px 15px;transition:background .15s ease,color .15s ease,border-color .15s ease;}
  .live .btn b{font-family:"Oswald",sans-serif;font-weight:600;text-transform:uppercase;font-size:14.5px;color:var(--ink);letter-spacing:.02em;}
  .live .btn span{font-size:11px;color:var(--ink-soft);}
  .live .btn:hover{background:var(--ink);border-color:var(--ink);}
  .live .btn:hover b,.live .btn:hover span{color:#fff;}
  .live .btn:focus-visible{outline:3px solid var(--alive);outline-offset:2px;}

  /* ---------- phase ---------- */
  .phase{padding:clamp(30px,4vw,44px) clamp(18px,4vw,48px);border-top:1px solid var(--line);}
  .phase-head{display:flex;align-items:baseline;gap:16px;flex-wrap:wrap;margin:0 0 22px;}
  .phase-head .no{font-family:"IBM Plex Mono",monospace;font-size:13px;font-weight:600;color:#fff;padding:4px 9px;border-radius:5px;letter-spacing:.08em;}
  .phase-head h2{font-family:"Oswald",sans-serif;font-weight:600;text-transform:uppercase;letter-spacing:.03em;font-size:clamp(23px,3.4vw,34px);margin:0;line-height:1;}
  .phase-head .note{font-size:14px;color:var(--ink-soft);margin:0;flex:1;min-width:200px;}
  .p1 .no{background:var(--cool);} .p1 h2{color:var(--cool);}
  .p2 .no{background:var(--ready);} .p2 h2{color:var(--ready);}
  .p3 .no{background:var(--alive);} .p3 h2{color:var(--alive);}
  .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px 20px 22px;position:relative;box-shadow:var(--shadow);transition:transform .18s ease,border-color .18s ease;}
  .card:hover{transform:translateY(-3px);}
  .p1 .card:hover{border-color:var(--cool);}
  .p2 .card:hover{border-color:var(--ready);}
  .p3 .card:hover{border-color:var(--alive);}
  .cardtop{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:2px;flex-wrap:wrap;}
  .card .idx{font-family:"IBM Plex Mono",monospace;font-size:12px;font-weight:600;color:var(--ink-soft);}
  .tag{font-family:"IBM Plex Mono",monospace;font-size:9.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:5px;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis;}
  .tag-iph{background:rgba(47,125,103,.16);color:#215849;}
  .tag-prep{background:rgba(200,138,22,.18);color:#835806;}
  .tag-aid{background:rgba(192,39,28,.14);color:#96241b;}
  .taglegend{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;padding:16px clamp(18px,4vw,48px) 0;font-size:13px;color:var(--ink-soft);}
  .taglegend .tag{margin-right:2px;}
  .card h3{font-family:"Oswald",sans-serif;font-weight:600;text-transform:uppercase;letter-spacing:.02em;font-size:19px;margin:6px 0 8px;line-height:1.08;}
  .card p{margin:0;font-size:15px;color:#38302a;}
  .card p b{color:var(--ink);}

  /* ---------- emergency zone ---------- */
  .zone{margin-top:16px;background:var(--deep);color:#F6EDE6;border-radius:14px;padding:clamp(24px,3.5vw,38px);box-shadow:0 24px 50px -24px rgba(124,19,14,.7);}
  .zone .kick{font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:#F3B0A8;margin:0 0 8px;}
  .zone h3{font-family:"Oswald",sans-serif;font-weight:700;text-transform:uppercase;font-size:clamp(28px,5vw,50px);line-height:.96;margin:0;letter-spacing:.01em;}
  .zone .sign{margin:18px 0 0;font-size:clamp(16px,2vw,19px);max-width:62ch;}
  .zone .sign b{color:#fff;background:rgba(255,255,255,.12);padding:1px 6px;border-radius:4px;}
  .zone-grid{display:grid;grid-template-columns:auto 1fr;gap:clamp(20px,3vw,40px);margin-top:26px;align-items:start;}
  .bignum{text-align:center;border:2px solid rgba(246,237,230,.45);border-radius:12px;padding:16px 24px;background:rgba(0,0,0,.14);text-decoration:none;color:#fff;display:inline-block;}
  .bignum b{font-family:"Oswald",sans-serif;font-size:clamp(56px,11vw,92px);font-weight:700;line-height:.9;display:block;color:#fff;}
  .bignum span{font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#F3B0A8;}
  .steps{margin:0;padding:0;list-style:none;counter-reset:s;display:grid;gap:12px;}
  .steps li{position:relative;padding-left:40px;font-size:clamp(15px,1.8vw,17px);counter-increment:s;}
  .steps li::before{content:counter(s);position:absolute;left:0;top:-1px;width:26px;height:26px;border-radius:50%;background:#fff;color:var(--deep);font-family:"Oswald",sans-serif;font-weight:700;font-size:15px;display:flex;align-items:center;justify-content:center;}
  .steps li b{color:#fff;}
  .zone .warn{margin:22px 0 0;padding:14px 16px;border-left:3px solid #F3B0A8;background:rgba(0,0,0,.14);font-size:15px;border-radius:0 8px 8px 0;}
  .zone .warn b{color:#fff;}
  .zone .basis{margin:16px 0 0;font-size:12.5px;color:#E9B4AC;opacity:.85;}

  /* ---------- footer ---------- */
  footer{border-top:1px solid var(--line);background:var(--paper-2);margin-top:8px;}
  footer .wrap{padding:26px 0 32px;display:flex;flex-wrap:wrap;gap:18px;justify-content:space-between;align-items:center;}
  footer .dial{font-family:"Oswald",sans-serif;font-weight:600;text-transform:uppercase;font-size:16px;color:var(--deep);}
  footer .dial b{font-size:22px;}
  footer .meta{font-size:12.5px;color:var(--ink-soft);max-width:60ch;font-family:"IBM Plex Mono",monospace;letter-spacing:.01em;}

  a:focus-visible,.card:focus-visible{outline:3px solid var(--alive);outline-offset:3px;}

  @media (max-width:820px){
    .stage{grid-template-columns:1fr;}
    .spine{display:none;}
    .grid{grid-template-columns:1fr;}
    .cols{grid-template-columns:1fr;}
    .live{grid-template-columns:1fr;}
    .live .btns{justify-content:flex-start;}
    .zone-grid{grid-template-columns:1fr;}
    .bignum{justify-self:start;}
  }
  @media (max-width:560px){ .topbar .tag{display:none;} }
  /* ---------- small screens: emergency buttons, headings, badges ---------- */
  @media (max-width:600px){
    .hero h1{font-size:clamp(40px,13.5vw,120px);}
    .call{display:flex;width:100%;margin-top:26px;}
    .call .l{max-width:none;flex:0 0 auto;}
    .call .n{flex:1 1 auto;padding:12px 20px;}
    .bignum{display:block;width:100%;padding:18px 20px;}
    .bignum b{font-size:64px;}
    .zone{padding:22px 18px;}
    .zone h3{font-size:clamp(25px,8vw,40px);}
    .zone .sign{font-size:16px;}
    .live .btns{flex-direction:column;}
    .live .btn{width:100%;}
    .cardtop{flex-wrap:nowrap;}
    .card .idx{flex:0 0 auto;}
    .tag{flex:0 1 auto;}
  }
  @media (max-width:400px){
    .langbtn{padding:8px 11px;font-size:12px;}
    .brand{font-size:14px;}
    .hero,.official,.phase{padding-left:16px;padding-right:16px;}
    .steps li{padding-left:36px;font-size:15px;}
    .steps li::before{width:24px;height:24px;font-size:14px;}
    .tag{font-size:9px;letter-spacing:.04em;padding:3px 7px;}
  }
  @media (prefers-reduced-motion:reduce){
    .hero h1{animation:none;background-position:0 0;}
    .live .dot{animation:none;}
    html{scroll-behavior:auto;}
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="wrap">
    <div class="brand">climate<b>.mk</b></div>
    <div class="tbright">
      <span class="tag" data-i18n="tag_top"></span>
      <div class="langsel" role="group" aria-label="Language / Јазик / Gjuha">
        <button class="langbtn" data-l="mk" onclick="setLang('mk')">MK</button>
        <button class="langbtn" data-l="sq" onclick="setLang('sq')">AL</button>
        <button class="langbtn" data-l="en" onclick="setLang('en')">EN</button>
      </div>
    </div>
  </div>
</div>

<div class="stage">
  <div class="spine" aria-hidden="true">
    <span class="lab l1" data-i18n="spine1"></span>
    <span class="tick t1"></span>
    <span class="lab l2" data-i18n="spine2"></span>
    <span class="tick t2"></span>
    <span class="lab l3" data-i18n="spine3"></span>
    <span class="tick t3"></span>
    <span class="lab l4" data-i18n="spine4"></span>
  </div>

  <div class="column">

    <!-- HERO -->
    <section class="hero">
      <p class="eyebrow" data-i18n="hero_eyebrow"></p>
      <h1 data-i18n="hero_h1"></h1>
      <p class="sub" data-i18n="hero_sub"></p>
      <p class="lede" data-i18n="hero_lede"></p>
      <a class="call" href="tel:112">
        <span class="l" data-i18n="hero_call_label"></span>
        <span class="n"><b>112</b><span data-i18n="hero_call_sub"></span></span>
      </a>
    </section>

    <!-- OFFICIAL GUIDANCE -->
    <section class="official">
      <span class="stamp" data-i18n="off_stamp"></span>
      <h2 data-i18n="off_h2"></h2>
      <p class="src" data-i18n="off_src"></p>
      <div class="cols">
        <div>
          <p class="panel-title" data-i18n="off_scaletitle"></p>
          <div class="scale" data-i18n="off_scale"></div>
          <p class="season" data-i18n="off_season"></p>
        </div>
        <div>
          <p class="panel-title" data-i18n="off_rectitle"></p>
          <ul class="check" data-i18n="off_reclist"></ul>
        </div>
      </div>

      <div class="live">
        <div class="txt" data-i18n="live_txt"></div>
        <div class="btns" data-i18n="live_btns"></div>
      </div>

      <div class="sources">
        <p class="panel-title" data-i18n="src_title"></p>
        <ul data-i18n="src_list"></ul>
      </div>
    </section>

    <p class="taglegend" data-i18n="legend"></p>

    <!-- PHASE 1 -->
    <section class="phase p1">
      <div class="phase-head">
        <span class="no">01</span>
        <h2 data-i18n="p1_h2"></h2>
        <p class="note" data-i18n="p1_note"></p>
      </div>
      <div class="grid">
        <div class="card" tabindex="0">
          <div class="cardtop"><span class="idx">01</span><span class="tag tag-iph" data-i18n="tag_iph"></span></div>
          <h3 data-i18n="c01_h3"></h3><p data-i18n="c01_p"></p>
        </div>
        <div class="card" tabindex="0">
          <div class="cardtop"><span class="idx">02</span><span class="tag tag-prep" data-i18n="tag_prep"></span></div>
          <h3 data-i18n="c02_h3"></h3><p data-i18n="c02_p"></p>
        </div>
        <div class="card" tabindex="0">
          <div class="cardtop"><span class="idx">03</span><span class="tag tag-iph" data-i18n="tag_iph"></span></div>
          <h3 data-i18n="c03_h3"></h3><p data-i18n="c03_p"></p>
        </div>
        <div class="card" tabindex="0">
          <div class="cardtop"><span class="idx">04</span><span class="tag tag-prep" data-i18n="tag_prep"></span></div>
          <h3 data-i18n="c04_h3"></h3><p data-i18n="c04_p"></p>
        </div>
      </div>
    </section>

    <!-- PHASE 2 -->
    <section class="phase p2">
      <div class="phase-head">
        <span class="no">02</span>
        <h2 data-i18n="p2_h2"></h2>
        <p class="note" data-i18n="p2_note"></p>
      </div>
      <div class="grid">
        <div class="card" tabindex="0">
          <div class="cardtop"><span class="idx">05</span><span class="tag tag-iph" data-i18n="tag_iph"></span></div>
          <h3 data-i18n="c05_h3"></h3><p data-i18n="c05_p"></p>
        </div>
        <div class="card" tabindex="0">
          <div class="cardtop"><span class="idx">06</span><span class="tag tag-prep" data-i18n="tag_prep"></span></div>
          <h3 data-i18n="c06_h3"></h3><p data-i18n="c06_p"></p>
        </div>
        <div class="card" tabindex="0">
          <div class="cardtop"><span class="idx">07</span><span class="tag tag-prep" data-i18n="tag_prep"></span></div>
          <h3 data-i18n="c07_h3"></h3><p data-i18n="c07_p"></p>

    c09_h3: "Rraskapitja nga i nxehti — paralajmërim", c09_p: "Djersitje e shumtë, lëkurë e zbehtë dhe e lagësht, marramendje, dhimbje koke, të përziera, dobësi, ngërçe. Çojeni personin në një vend të freskët, shtrijeni, ftohni lëkurën dhe jepini lëngje. <b>Nuk përmirësohet brenda 30 minutave? Trajtojeni si goditje nga i nxehti.</b>",

    zone_112sub: "Telefononi së pari",

function setLang(l){
  var d = I18N[l] || I18N.mk;
  var nodes = document.querySelectorAll('[data-i18n]');
  for(var i=0;i<nodes.length;i++){
    var k = nodes[i].getAttribute('data-i18n');
    if(d[k] != null) nodes[i].innerHTML = d[k];
  }
  var btns = document.querySelectorAll('.langbtn');
  for(var j=0;j<btns.length;j++){
    btns[j].setAttribute('aria-pressed', String(btns[j].getAttribute('data-l') === l));
  }
  document.documentElement.setAttribute('lang', l);
  if(d.doctitle) document.title = d.doctitle;
}
setLang('mk');
