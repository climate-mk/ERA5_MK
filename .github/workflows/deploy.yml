name: Deploy to production

on:
  push:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keygen -y -f ~/.ssh/id_ed25519 > /dev/null
          cat >> ~/.ssh/config << 'EOF'
          Host 46.224.208.142
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
          EOF

      - name: Deploy via rsync
        run: |
          rsync -az \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='__pycache__' \
            --exclude='*.pyc' \
            --exclude='venv' \
            --exclude='data' \
            --exclude='deploy.sh' \
            --exclude='*.sqlite' \
            ./ root@46.224.208.142:/opt/mk_climate/

      - name: Write .env
        run: |
          ssh root@46.224.208.142 "cat > /opt/mk_climate/.env << 'EOF'
          COUNTRY=mk
          DIRECT_LINE_SECRET=${{ secrets.DIRECT_LINE_SECRET }}
          ANALYTICS_EXPORT_KEY=${{ secrets.ANALYTICS_EXPORT_KEY }}
          TODAY_REFRESH_KEY=${{ secrets.TODAY_REFRESH_KEY }}
          FIRMS_MAP_KEY=${{ secrets.FIRMS_MAP_KEY }}
          GFW_API_KEY=${{ secrets.GFW_API_KEY }}
          EOF
          chmod 600 /opt/mk_climate/.env"

      - name: Install dependencies & restart service
        run: |
          ssh root@46.224.208.142 "
            cd /opt/mk_climate &&
            venv/bin/pip install -q -r requirements.txt &&
            chown -R www-data:www-data /opt/mk_climate &&
            systemctl restart mk_climate &&
            sleep 4 &&
            systemctl is-active mk_climate
          "

      # NOTE: `data/` is excluded from rsync (built on the server, not shipped).
      # Fire CSVs under data/mk/fires/ are populated by the hourly cron/fire_collect
      # going forward. On a fresh server (no fire CSVs yet), kick off the full
      # historical backfill once, in the background, so this step doesn't block the
      # deploy for the ~30-60 min a full --force-refresh takes. Safe to leave in:
      # once data/mk/fires/ has files, this step is a no-op on every future deploy —
      # the hourly cron alone keeps it current from then on.
      - name: One-time historical fire backfill (fresh server only)
        run: |
          ssh -o ServerAliveInterval=15 root@46.224.208.142 "
            cd /opt/mk_climate &&
            if [ -z \"\$(ls -A data/mk/fires/*.csv 2>/dev/null)\" ]; then
              echo 'No fire data found — starting full historical backfill in the background (~30-60 min)...' &&
              nohup env COUNTRY=mk venv/bin/python fire_collect.py --force-refresh < /dev/null > /var/log/fire_collect_backfill.log 2>&1 &
              disown &&
              echo 'Backfill started; hourly cron will keep it updated from here.'
            else
              echo 'Fire data already present — skipping backfill (hourly cron keeps it current).'
            fi
          "

      - name: Install cron jobs
        run: |
          ssh root@46.224.208.142 "
            cp /opt/mk_climate/cron/mk_collect /etc/cron.d/mk_climate &&
            chmod 644 /etc/cron.d/mk_climate &&
            cp /opt/mk_climate/cron/climate_news /etc/cron.d/mk_climate_news &&
            chmod 644 /etc/cron.d/mk_climate_news &&
            cp /opt/mk_climate/cron/climate_news_serpapi /etc/cron.d/mk_climate_news_serpapi &&
            chmod 644 /etc/cron.d/mk_climate_news_serpapi &&
            cp /opt/mk_climate/cron/today_status_refresh /etc/cron.d/mk_today_status_refresh &&
            chmod 644 /etc/cron.d/mk_today_status_refresh &&
            cp /opt/mk_climate/cron/fire_collect /etc/cron.d/mk_fire_collect &&
            chmod 644 /etc/cron.d/mk_fire_collect &&
            echo 'Cron installed:' &&
            cat /etc/cron.d/mk_climate &&
            cat /etc/cron.d/mk_climate_news &&
            cat /etc/cron.d/mk_climate_news_serpapi &&
            cat /etc/cron.d/mk_today_status_refresh &&
            cat /etc/cron.d/mk_fire_collect
          "

      - name: Health check
        run: |
          sleep 5
          ssh root@46.224.208.142 "curl -sf http://localhost:5050/api/meta" | python3 -c "
          import sys, json
          d = json.load(sys.stdin)
          print('Health OK —', len(d['locations']), 'locations loaded')
          "

      - name: Warm slow caches
        run: |
          echo "Warming slow caches (endpoints returning 204 are disabled features — skipped)..."
          ssh root@46.224.208.142 "
            for url in \
              http://localhost:5050/api/spei_station_seasonal \
              http://localhost:5050/api/spei_heatmap \
              http://localhost:5050/api/season_heatmap \
              http://localhost:5050/api/fires/yearly; do
              status=\$(curl -s -o /dev/null -w '%{http_code}' \"\$url\")
              name=\$(echo \"\$url\" | sed 's|.*/||')
              if [ \"\$status\" = '204' ]; then
                echo \"  skipped (disabled): \$name\"
              else
                echo \"  warmed [\$status]: \$name\"
              fi
            done
          "

      - name: Warm fire overlay-tile cache
        continue-on-error: true
        run: |
          echo "Warming the WMS overlay-tile cache (fire danger, Sentinel-3, burnt-area, GHSL, WDPA)..."
          echo "The endpoint starts the warm and returns immediately; tiles fill in over the next few minutes."
          ssh -o ServerAliveInterval=15 root@46.224.208.142 "
            status=\$(curl -s --max-time 30 -o /dev/null -w '%{http_code}' -X POST \"http://localhost:5050/api/fires/tiles/warm?key=\$(grep -o 'TODAY_REFRESH_KEY=.*' /opt/mk_climate/.env | cut -d= -f2-)\")
            case \"\$status\" in
              204) echo '  skipped (fires disabled)'; exit 0 ;;
              409) echo '  already warming (previous run still in flight)' ;;
              200) echo '  tile warm started' ;;
              *)   echo \"  tile warm [\$status] — cold cache only means a slower first paint\"; exit 0 ;;
            esac

            # The warm runs in the background, so report what actually landed on
            # disk — otherwise a green deploy says nothing about the cache state.
            echo '  waiting 90s for the background warm...'
            sleep 90
            tiles=/opt/mk_climate/cache/mk/fires/tiles
            echo \"  total tiles cached: \$(find \$tiles -name '*.png' 2>/dev/null | wc -l)\"
            for d in \$(find \$tiles -mindepth 2 -maxdepth 2 -type d 2>/dev/null | sort); do
              echo \"    \$(find \$d -name '*.png' | wc -l | tr -d ' ') tiles  \${d#\$tiles/}\"
            done
            # A blank tile is EFFIS erroring out; those are never cached, so they
            # are refetched live on every pan and look exactly like a slow layer.
            blanks=\$(find \$tiles -name '*.png' -size -200c 2>/dev/null | wc -l)
            echo \"  suspiciously small tiles (likely upstream errors): \$blanks\"
          "

      - name: Warm per-location today/trend caches
        run: |
          echo "Warming today_status + annual_trend caches (national + every station)..."
          ssh root@46.224.208.142 "
            status=\$(curl -s -o /dev/null -w '%{http_code}' http://localhost:5050/api/today_status)
            if [ \"\$status\" = '204' ]; then
              echo '  skipped (today_section disabled)'
            else
              curl -s -o /dev/null http://localhost:5050/api/today_status
              curl -s -o /dev/null http://localhost:5050/api/annual_trend
              echo '  warmed: national'
              locations=\$(curl -s http://localhost:5050/api/meta | python3 -c 'import sys,json,urllib.parse; [print(urllib.parse.quote(l)) for l in json.load(sys.stdin)[\"locations\"]]')
              for loc in \$locations; do
                curl -s -o /dev/null \"http://localhost:5050/api/today_status?loc=\$loc\"
                curl -s -o /dev/null \"http://localhost:5050/api/annual_trend?loc=\$loc\"
                echo \"  warmed: \$loc\"
              done
            fi
          "
